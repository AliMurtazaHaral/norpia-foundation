# NORPIA — reverse proxy in front of the app container.
# No domain yet: this server block answers on the VPS IP over plain HTTP.
# When a domain lands, set server_name, mount certs, and enable the TLS block below.

upstream norpia_app {
    server app:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 25m;

    # Security headers (HSTS is intentionally deferred until TLS is enabled).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed build assets are immutable.
    location /_build/ {
        proxy_pass http://norpia_app;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://norpia_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}

