# NORPIA — production stack for a self-managed VPS.
# Usage:
#   cp .env.production.example .env.production
#   edit .env.production (strong POSTGRES_PASSWORD, real APP_ORIGIN)
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# Only Nginx publishes a host port. App and DB stay on the internal network.

services:
  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: postgres://${POSTGRES_USER:-norpia}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-norpia}
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-norpia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-norpia}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-norpia}"]
      interval: 10s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      # Uncomment once a domain + certificates exist (see docs/deployment.md).
      # - "443:443"
    volumes:
      - ./infrastructure/nginx/norpia.conf:/etc/nginx/conf.d/default.conf:ro
      # - ./infrastructure/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - app

volumes:
  postgres_data:
